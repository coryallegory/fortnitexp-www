<p>
  Use this calculator to estimate how much XP you need to reach your desired level in Fortnite this season.
</p>

<div class="calculator-container">
  <form id="xpCalculator">
    <div class="custom-form-row">
      <div class="custom-form-group">
        <label for="currentLevel">Current Level:</label>
        <input type="number" id="currentLevel" name="currentLevel" min="1" max="1000" value="1" required>
      </div>

      <div class="custom-form-group">
        <label for="desiredLevel">Desired Level:</label>
        <input type="number" id="desiredLevel" name="desiredLevel" min="1" max="1000" value="200" required>
      </div>
    </div>

    <div class="custom-form-group">
      <div class="checkbox-wrapper">
        <input type="checkbox" id="globalDailyGoalCheckbox">
        <label for="globalDailyGoalCheckbox">3x Global Daily Goals (3x 1k + 3x 25k):</label>
      </div>
      <input type="number" id="globalDailyGoal" name="globalDailyGoal" value="78000" readonly disabled>
    </div>

    <div class="custom-form-group">
      <label for="creativeXp">Daily Creative XP:</label>
      <input type="number" id="creativeXp" name="creativeXp" min="0" placeholder="0">
    </div>

    <div class="custom-form-group">
      <label for="stwXp">Save the World XP:</label>
      <input type="number" id="stwXp" name="stwXp" min="0" placeholder="0">
    </div>

    <div class="custom-form-group">
      <label for="otherXp">Other XP:</label>
      <input type="number" id="otherXp" name="otherXp" min="0" placeholder="0">
    </div>

    <button type="button" id="calculateButton">Calculate</button>
  </form>

  <div id="calculatorResults" class="results-container">
    <p>Enter your details above and click "Calculate" to see your results.</p>
  </div>
</div>
